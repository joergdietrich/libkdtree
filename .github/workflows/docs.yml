name: Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The self-hosted runner has the autotools and doxygen installed
  build:
    runs-on: [self-hosted, Linux, X64, libkdtree]
    steps:
      - uses: actions/checkout@v7

      # doxygen-run makes the HTML only; the PDF would need LaTeX
      - name: Build HTML documentation
        run: |
          autoreconf -fi
          ./configure
          make doxygen-run

      - uses: actions/upload-pages-artifact@v5
        with:
          path: doxygen-doc/html

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, libkdtree]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
